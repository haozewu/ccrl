[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrl"
version = "0.1.0"
description = "Python implementation of the CCRL method from Advanced Engineering Informatics paper DOI 10.1016/j.aei.2025.103297."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "haoze" }
]
keywords = ["ccrl", "fault diagnosis", "reinforcement learning", "contrastive learning", "paper implementation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "coloredlogs>=15.0.1",
  "numpy>=1.24",
  "scikit-learn>=1.3.2",
  "tensorboard>=2.0",
  "torch>=2.1.1"
]

[project.urls]
Homepage = "https://github.com/haozewu/ccrl"
Repository = "https://github.com/haozewu/ccrl"
Paper = "https://doi.org/10.1016/j.aei.2025.103297"

[project.scripts]
ccrl = "ccrl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
